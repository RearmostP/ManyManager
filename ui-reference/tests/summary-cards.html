<!doctype html>
<html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ManyManager — approved summary cards</title>
<style>body{margin:0;background:#e7eaf0}iframe{display:block;width:min(100%,440px);height:100dvh;border:0;margin:auto}</style>
<iframe title="ManyManager optional visual fixture" src="../index.html"></iframe>
<script type="module">
const frame=document.querySelector("iframe");
const timer=setInterval(()=>{
 if(!frame.contentDocument?.querySelector('[data-action="expense"]'))return;
 clearInterval(timer);
 const script=frame.contentDocument.createElement("script");script.type="module";
 script.src=new URL("summary-card-fixture.js",location.href).href;
 frame.contentDocument.body.append(script);
},20);
</script></html>
