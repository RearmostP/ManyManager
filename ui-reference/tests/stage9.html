<!doctype html><meta charset="utf-8"><meta name="google" content="notranslate"><base href="../">
<title>Summary consistency checks — stage 9</title><h1>Summary consistency checks — stage 9</h1><pre id="results">Running…</pre>
<script type="module">
import {previewModel,addCategory,addSource,createExpense,correctExpenseAmount,snapshotFor,updateSource} from "../js/preview-model.js";
import {state} from "../js/state.js";
import {summary} from "../js/screens/summary.js";
import {home} from "../js/screens/home.js";
import {expense} from "../js/components/expense-sheet.js";
import {loadLanguage} from "../js/i18n.js";
const results=[],check=(value,label)=>{if(!value)throw Error(label);results.push("PASS "+label)};
const host=document.createElement("div");
const render=tab=>{state.tab=tab;host.innerHTML=summary();return [...host.querySelectorAll("[data-breakdown-id]")]};
const sum=rows=>rows.reduce((total,row)=>total+row.spent,0);
try{
 await loadLanguage("en");state.language="en";state.currentDate=new Date(2026,10,10);
 const date=state.currentDate,a=addSource("Same",date,500),b=addSource("Same",date,0),unused=addSource("Unused",date,0);
 const ca=addCategory("Same"),cb=addCategory("Same");addCategory("Unused");
 for(const tab of [0,1]){check(render(tab).length===0&&host.textContent.includes("No expenses"),"successful empty tab "+tab)}
 const first=createExpense({amountMinor:29,date:"2026-11-10",sourceId:a.id,categoryId:ca.id});
 createExpense({amountMinor:11,date:"2026-11-10",sourceId:b.id,categoryId:cb.id});
 createExpense({amountMinor:18,date:"2026-11-10",sourceId:b.id,categoryId:null});
 let snap=snapshotFor(date);
 check(sum(snap.categoryBreakdown)===58&&sum(snap.sourceBreakdown)===58&&snap.spent===58,"independent breakdown sums each match overall spending");
 check(snap.expenses.length===3&&snap.categoryBreakdown.reduce((n,r)=>n+r.expenseCount,0)===3&&snap.sourceBreakdown.reduce((n,r)=>n+r.expenseCount,0)===3,"each expense counted once per breakdown");
 check(snap.categoryBreakdown.length===3&&snap.categoryBreakdown.some(row=>row.id===null&&row.spent===18),"nullable category group");
 check(snap.categoryBreakdown.filter(row=>row.name==="Same").length===2,"duplicate category names keep distinct IDs");
 check(snap.sourceBreakdown.length===2&&snap.sourceBreakdown.every(row=>row.name==="Same"),"duplicate sources remain separate and unused source omitted");
 check(snap.sourceBreakdown.find(row=>row.id===b.id).spent===29,"zero allocation still has spending row");
 check(snap.categoryBreakdown.map(row=>row.id).join(",")===[ca.id,null,cb.id].join(","),"category descending spending order");
 check(snap.sourceBreakdown.map(row=>row.id).join(",")===[a.id,b.id].join(","),"stable source ID tie order");
 previewModel.expenses.reverse();check(JSON.stringify(snapshotFor(date).categoryBreakdown)===JSON.stringify(snap.categoryBreakdown),"order independent of input record order");
 const categoryRows=render(0);check(categoryRows.length===3&&host.textContent.includes("Uncategorized")&&host.textContent.includes("0.29"),"category presentation uses prepared values");
 check(categoryRows.every(row=>row.getAttribute("aria-label").includes("Expenses:")),"accessible name amount count");
 check(render(1).length===2&&host.textContent.includes("0.29"),"source panel displays spending rather than allocation");
 check(!host.querySelector("[data-breakdown-id] button"),"breakdowns have no new actions");
 check(correctExpenseAmount(first.id,30),"amount correction succeeds");
 snap=snapshotFor(date);check(snap.spent===59&&sum(snap.categoryBreakdown)===59&&sum(snap.sourceBreakdown)===59&&snap.expenses.length===3,"correction updates groups without changing count");
 const moneyBefore=snap.sourceBreakdown.map(row=>row.spent).join(",");
 check(updateSource(b.id,"Renamed",date,0),"source rename");
 snap=snapshotFor(date);check(snap.sourceBreakdown.find(row=>row.id===b.id).name==="Renamed"&&snap.spent===59,"renamed label stable spending");
 check(snap.sourceBreakdown.map(row=>row.spent).join(",")===moneyBefore&&snap.allocated===500,"rename leaves money unchanged");
 check(updateSource(b.id,"Renamed",date,100),"allocation adjustment");
 snap=snapshotFor(date);check(snap.allocated===600&&snap.remaining===541&&snap.spent===59,"budget adjustment changes only allocation and remaining");
 state.budgetMonth=new Date(2026,11,10);check(render(1).length===2&&home().includes("0.59"),"historical management selection does not change home or summary");
 const next=snapshotFor(state.budgetMonth);check(next.spent===0&&next.allocated===0&&next.categoryBreakdown.length===0&&next.sourceBreakdown.length===0&&next.sources.length===3,"new period empty with retained sources no carry");
 state.expenseDraft={amount:"1.23",date:"2026-11-10",note:"Keep",categoryId:ca.id,sourceId:b.id};
 const draft=JSON.stringify(state.expenseDraft);addCategory("New");addSource("New",date,0);expense();
 check(JSON.stringify(state.expenseDraft)===draft,"observed choice refresh preserves entire draft");
 for(const language of ["he","ru","en"]){
  await loadLanguage(language);state.language=language;
  check(render(0).length===3&&!host.textContent.includes("breakdown_"),language+" category localization");
  check(render(1).length===2&&host.textContent.includes("Renamed"),language+" source localization");
 }
 const frame=document.createElement("iframe");frame.src="index.html";frame.style="width:320px;height:850px";document.body.append(frame);
 const wait=async fn=>{const limit=performance.now()+10000;while(!fn()){if(performance.now()>limit)throw Error("event timeout");await new Promise(resolve=>setTimeout(resolve,20))}};
 await wait(()=>frame.contentDocument?.querySelector('[data-action="expense"]'));
 const doc=frame.contentDocument,click=selector=>doc.querySelector(selector).click(),type=(selector,value)=>{const input=doc.querySelector(selector);input.value=value;input.dispatchEvent(new frame.contentWindow.Event("input",{bubbles:true}))};
 click("#menu-button");click('[data-action="navigate"][data-index="3"]');click('[data-action="add-source"]');type("#source-name","Preview source");type("#source-initial","0");click('[data-action="confirm-add-source"]');
 click("#menu-button");click('[data-action="navigate"][data-index="0"]');click('[data-action="expense"]');type("#amount","1.23");click('[data-action="expense-source"]');click('[data-action="save-expense"]');
 click("#menu-button");click('[data-action="navigate"][data-index="1"]');
 check(doc.querySelectorAll("[data-breakdown-id]").length===1,"real app uncategorized group after save");
 click('[data-action="tab"][data-index="1"]');check(doc.querySelector("[data-breakdown-id]").textContent.includes("Preview source")&&doc.querySelector("[data-breakdown-id]").textContent.includes("1.23"),"real app source group after save");
 click('[data-action="tab"][data-index="2"]');click('[data-action="correct-expense"]');type("#correction-amount","2.34");click('[data-action="confirm-expense-correction"]');
 click('[data-action="tab"][data-index="0"]');check(doc.querySelector("[data-breakdown-id]").textContent.includes("2.34"),"real app category follows correction");
 click('[data-action="tab"][data-index="1"]');check(doc.querySelector("[data-breakdown-id]").textContent.includes("2.34"),"real app source follows correction");
 frame.remove();
 document.getElementById("results").textContent=results.join("\n")+"\nALL "+results.length+" PASSED";
}catch(error){document.getElementById("results").textContent=results.join("\n")+"\nFAIL "+error.stack;throw error}
</script>
